<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The app is French. Browser auto-translate (Chrome "Translate this page")
         rewrites text nodes out from under React, which then crashes on
         insertBefore/removeChild ("node ... is not a child of this node") and
         white-screens behind the error boundary — seen in production on Chrome.
         Opt the whole document out of machine translation. -->
    <meta name="google" content="notranslate" />

    <!-- Added for the PWA icon - Start -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prix MTQ" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="description" content="Ensemble contre la vie chère - Comparez les prix en Martinique" />
    <!-- Added for the PWA icon - End -->

    <!-- Anton: display font for the "Prix Martinique" wordmark banner, matching the instruction-manual design -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />

    <title>Prix Martinique</title>
  </head>
  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
